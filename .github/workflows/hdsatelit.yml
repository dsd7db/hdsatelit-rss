
name: HD Satelit RSS

on:
  workflow_dispatch:

  schedule:
    - cron: '17 */6 * * *'

  push:
    branches:
      - main
    paths:
      - 'hdsatelit_scraper.py'
      - 'hdsatelit_google_news.py'
      - 'requirements.txt'
      - '.github/workflows/hdsatelit.yml'

permissions:
  contents: read

concurrency:
  group: hdsatelit-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate RSS
        run: python hdsatelit_google_news.py

      - name: Validate RSS
        run: |
          test -s hdsatelit.xml
          python -c "import xml.etree.ElementTree as ET; ET.parse('hdsatelit.xml')"

      - name: Save article history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdsatelit_google_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update HD Satelit article history"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p public
          cp hdsatelit.xml public/hdsatelit.xml
          printf '%s\n' '<!doctype html><html lang="ro"><meta charset="utf-8"><title>HD Satelit RSS</title><body><h1>HD Satelit RSS</h1><p><a href="hdsatelit.xml">Flux RSS</a></p></body></html>' > public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
